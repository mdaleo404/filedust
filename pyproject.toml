[project]
name = "filedust"
version = "0.5.1"
description = "Opinionated junk cleaner for dev machines (caches, build artifacts, editor backups)."
authors = [{ name = "Marco D'Aleo", email = "marco@marcodaleo.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "rich>=12",
    "argcomplete>=2",
]

[project.urls]
Homepage = "https://git.sysmd.uk/guardutils/filedust"
Repository = "https://git.sysmd.uk/guardutils/filedust"

[project.scripts]
filedust = "filedust.cli:main"

[tool.poetry]
packages = [{ include = "filedust", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
pre-commit = "^4.0.0"

[tool.black]
line-length = 79

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
